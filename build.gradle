plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Default main class for `./gradlew run`
application {
    mainClass = 'net.jetztgrad.midi.workshop.ListDevices'
}

def pkg = 'net.jetztgrad.midi.workshop'

// ── Workshop tasks ──────────────────────────────────────────────────────────
// Run each example with its own task, e.g.:  ./gradlew listDevices
//
// Optional: select a specific MIDI output device by partial name
//   ./gradlew playNote       -Pdevice=XIAO
//   ./gradlew simpleSequence -Pdevice="IAC Bus"
// Without -Pdevice the platform's default software synthesizer is used.

tasks.register('listDevices', JavaExec) {
    group = 'workshop'
    description = 'List all available MIDI devices'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.ListDevices"
    dependsOn compileJava
}

tasks.register('playNote', JavaExec) {
    group = 'workshop'
    description = 'Play a single MIDI note (-Pdevice=<name> to target a specific device)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.PlayNote"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))  { args '--patch='  + project.property('patch')  }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('simpleSequence', JavaExec) {
    group = 'workshop'
    description = 'Play a programmatic C-E-G-C sequence (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.SimpleSequence"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))  { args '--patch='  + project.property('patch')  }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('midiFilePlayer', JavaExec) {
    group = 'workshop'
    description = 'Play a MIDI file (-PmidiFile=<path>, -Pdevice=<name> both optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.MidiFilePlayer"
    dependsOn compileJava
    if (project.hasProperty('midiFile')) { args project.property('midiFile') }
    if (project.hasProperty('device'))   { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))    { args '--patch='  + project.property('patch')  }
    if (project.hasProperty('spy'))      { args '--spy' }
}

tasks.register('drumPattern', JavaExec) {
    group = 'workshop'
    description = 'Play a basic 4/4 drum pattern on channel 10 (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.DrumPattern"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('programChange', JavaExec) {
    group = 'workshop'
    description = 'Play 4 GM patches on the same phrase (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.ProgramChange"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('midiPanic', JavaExec) {
    group = 'workshop'
    description = 'Send All Notes Off on all channels — clears stuck notes (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.MidiPanic"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('midiMonitor', JavaExec) {
    group = 'workshop'
    description = 'Monitor incoming MIDI messages (-Pdevice=<name>, -Pchannel=<1-16|all> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.MidiMonitor"
    dependsOn compileJava
    if (project.hasProperty('device'))  { args '--device='  + project.property('device')  }
    if (project.hasProperty('channel')) { args '--channel=' + project.property('channel') }
}

tasks.register('myMelody', JavaExec) {
    group = 'workshop'
    description = 'Run the hands-on exercise: your own melody (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.exercise.MyMelody"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))  { args '--patch='  + project.property('patch')  }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('pianoRoll', JavaExec) {
    group = 'workshop'
    description = 'Play a piano roll text notation (--file=<path> or built-in demo)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.PianoRollPlayer"
    dependsOn compileJava
    if (project.hasProperty('file'))   { args '--file='   + project.property('file')   }
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))  { args '--patch='  + project.property('patch')  }
    if (project.hasProperty('spy'))    { args '--spy' }
}

tasks.register('toRoll', JavaExec) {
    group = 'workshop'
    description = 'Convert a MIDI file to piano roll notation (-PmidiFile=<path>, -Pout=<path>)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.MidiToRoll"
    dependsOn compileJava
    if (project.hasProperty('midiFile'))   { args '--file='       + project.property('midiFile')   }
    if (project.hasProperty('out'))        { args '--out='        + project.property('out')        }
    if (project.hasProperty('track'))      { args '--track='      + project.property('track')      }
    if (project.hasProperty('channel'))    { args '--channel='    + project.property('channel')    }
    if (project.hasProperty('resolution')) { args '--resolution=' + project.property('resolution') }
}

tasks.register('liveTerminalKeyboard', JavaExec) {
    group = 'workshop'
    description = 'Play notes live using the terminal keyboard (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.LiveTerminalKeyboard"
    dependsOn compileJava
    standardInput = System.in
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))  { args '--patch='  + project.property('patch')  }
}

tasks.register('liveWindowKeyboard', JavaExec) {
    group = 'workshop'
    description = 'Play notes live using a Swing window (-Pdevice=<name> optional)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.LiveWindowKeyboard"
    dependsOn compileJava
    if (project.hasProperty('device')) { args '--device=' + project.property('device') }
    if (project.hasProperty('patch'))  { args '--patch='  + project.property('patch')  }
}

// ── Slide build ──────────────────────────────────────────────────────────────
// Requires Node.js / npx.  Run once after editing slides/slides.md or slides-de.md.
//   ./gradlew buildSlides
// Or invoke npx directly:
//   npx --yes @marp-team/marp-cli@latest slides/slides.md    --html -o slides/slides.html
//   npx --yes @marp-team/marp-cli@latest slides/slides-de.md --html -o slides/slides-de.html

tasks.register('buildSlidesEn', Exec) {
    commandLine 'npx', '--yes', '@marp-team/marp-cli@latest',
            'slides/slides.md', '--html', '-o', 'slides/slides.html'
}

tasks.register('buildSlidesDe', Exec) {
    commandLine 'npx', '--yes', '@marp-team/marp-cli@latest',
            'slides/slides-de.md', '--html', '-o', 'slides/slides-de.html'
}

tasks.register('buildSlides') {
    group = 'workshop'
    description = 'Rebuild slide HTML from Marp markdown sources (requires npx / Node.js)'
    dependsOn 'buildSlidesEn', 'buildSlidesDe'
}
