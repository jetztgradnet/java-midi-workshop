plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Default main class for `./gradlew run`
application {
    mainClass = 'net.jetztgrad.midi.workshop.ListDevices'
}

def pkg = 'net.jetztgrad.midi.workshop'

// ── Workshop tasks ──────────────────────────────────────────────────────────
// Run each example with its own task, e.g.:  ./gradlew listDevices

tasks.register('listDevices', JavaExec) {
    group = 'workshop'
    description = 'List all available MIDI devices'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.ListDevices"
    dependsOn compileJava
}

tasks.register('playNote', JavaExec) {
    group = 'workshop'
    description = 'Play a single MIDI note via the software synthesizer'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.PlayNote"
    dependsOn compileJava
}

tasks.register('simpleSequence', JavaExec) {
    group = 'workshop'
    description = 'Play a programmatic C-E-G-C sequence'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.SimpleSequence"
    dependsOn compileJava
}

tasks.register('midiFilePlayer', JavaExec) {
    group = 'workshop'
    description = 'Play a MIDI file (default: first file in midi/)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.MidiFilePlayer"
    dependsOn compileJava
    // Override file via: ./gradlew midiFilePlayer --args="midi/myfile.mid"
    if (project.hasProperty('midiFile')) {
        args(project.property('midiFile'))
    }
}

tasks.register('drumPattern', JavaExec) {
    group = 'workshop'
    description = 'Play a basic 4/4 drum pattern on channel 10'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.DrumPattern"
    dependsOn compileJava
}

tasks.register('programChange', JavaExec) {
    group = 'workshop'
    description = 'Play the same phrase with 4 different GM instrument patches'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.ProgramChange"
    dependsOn compileJava
}

tasks.register('myMelody', JavaExec) {
    group = 'workshop'
    description = 'Run the hands-on exercise: your own melody'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "${pkg}.exercise.MyMelody"
    dependsOn compileJava
}
